# Minimal open-model replication: the paper's 12 scenarios x 12 conditions x 3 reps,
# with Qwen3-8B served locally by vLLM as both buyer and seller.
name: qwen3-8b
model:
  hf_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  # Qwen3 thinks by default; the paper's API runs used no reasoning traces, so it's off.
  chat_template_kwargs:
    enable_thinking: false
generation:
  temperature: 0.2  # same as the paper
  max_tokens: 512
  base_seed: 42
design:
  scenarios: data/scenarios.json
  n_repetitions: 3
  max_turns: 16
  max_parse_retries: 3
runtime:
  concurrency: 128  # negotiations in flight; vLLM batches their requests together
