# Fixed-protocol counterpart of configs/gemma-4-e4b-it.yaml: same model and decoding, but
# the message format and action validation that stop 8B models from breaking
# the negotiation (copy loops, opening accepts). Compare against the paper run.
name: gemma-4-e4b-it-fixed
model:
  hf_id: google/gemma-4-E4B-it
  revision: ee0ef6023621cff504d758262d4e04895a5af4a2
  generation_config: vllm  # ignore generation_config.json sampling defaults
  # The paper's API runs recorded no reasoning traces, so thinking is off
  # (templates without a thinking switch ignore this).
  chat_template_kwargs:
    enable_thinking: false
generation:
  temperature: 0.2  # same as the paper
  max_tokens: 512
  base_seed: 42
protocol:
  message_format: continue_json  # own past turns as JSON + a turn request
  validate_actions: true  # regenerate opening accepts, priceless offers, unknown actions
design:
  scenarios: data/scenarios.json
  n_repetitions: 3
  max_turns: 16
  max_parse_retries: 3
runtime:
  concurrency: 128  # negotiations in flight; vLLM batches their requests together
