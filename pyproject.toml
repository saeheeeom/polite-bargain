[project]
name = "polite-bargain"
version = "0.2.0"
description = "Cross-lingual LLM negotiation: paper code (src/) and the open-model eval harness (harness/)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "paper_data: needs the original (gitignored) transcripts under results/",
]
